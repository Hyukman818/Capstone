<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>카카오 지도 테스트</title>
    <style>
        #map { width: 100%; height: 500px; }
        .status { padding: 20px; font-family: sans-serif; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="status">
        <h2>카카오 지도 API 테스트</h2>
        <p id="status">로딩 중...</p>
    </div>
    <div id="map"></div>

    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=5f0a7caf0dc8a561775e3cc76b75c11b"></script>
    <script>
        const statusEl = document.getElementById('status');

        // 스크립트 로드 실패 감지
        window.addEventListener('error', function(e) {
            if (e.target.tagName === 'SCRIPT') {
                statusEl.className = 'error';
                statusEl.innerHTML = '❌ 카카오 지도 스크립트 로드 실패<br>네트워크 탭에서 401 오류를 확인하세요.';
            }
        }, true);

        // Kakao Maps 초기화
        if (window.kakao && window.kakao.maps) {
            try {
                const container = document.getElementById('map');
                const options = {
                    center: new kakao.maps.LatLng(37.566826, 126.9786567),
                    level: 3
                };
                const map = new kakao.maps.Map(container, options);

                statusEl.className = 'success';
                statusEl.innerHTML = '✅ 카카오 지도 API 로드 성공!<br>지도가 정상적으로 표시됩니다.';
            } catch (error) {
                statusEl.className = 'error';
                statusEl.innerHTML = '❌ 지도 초기화 실패: ' + error.message;
            }
        } else {
            setTimeout(() => {
                statusEl.className = 'error';
                statusEl.innerHTML = '❌ Kakao Maps 객체를 찾을 수 없습니다.<br>스크립트 로드가 실패했거나 API 키가 잘못되었을 수 있습니다.';
            }, 2000);
        }
    </script>
</body>
</html>
